<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portal de Poderes</title>

    <link rel="stylesheet" href="index.css">
    <script src="index.js" defer></script>
    
</head>

<body>

    <main class="portal">

        <h1>🔮 Portal Arcano</h1>

        <section class="powers">


            <button class="power fire">
                <span>Fuego</span>
            </button>


            <button class="power ice">
                ❄️
                <span>Hielo</span>
            </button>


            <button class="power lightning">
                ⚡
                <span>Rayo</span>
            </button>


            <button class="power nature">
                🌱
                <span>Naturaleza</span>
            </button>


            <button class="power dark">
                🌑
                <span>Oscuridad</span>
            </button>


            <button class="power light">
                ✨
                <span>Luz</span>
            </button>


        </section>


        <section class="info">

            <h2>Poder seleccionado</h2>

            <p id="name">
                Ninguno
            </p>


            <div class="energy">

                <div id="bar"></div>

            </div>

        </section>


    </main>




</body>
</html>
