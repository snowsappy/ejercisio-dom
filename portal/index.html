<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portal de Poderes</title>

    <link rel="stylesheet" href="index.css">
    <script src="index.js" defer></script>
    
</head>

<body>

    <main class="portal">

        <h1>ARCANE PORTAL</h1>
        

        <section class="powers">

                <div class="card">
                <div class="card-inner">

                    <div class="power fire">
                        <img src="carta fuego sin fonso.png">
                    </div>

                    <div class="back fire-back">
                        Fire
                    </div>

                </div>
            </div>

            <div class="card">
                <div class="card-inner">

                    <div class="power ice">
                        <img src="carta hielo.png" alt="">
                    </div>

                    <div class="back ice-back">
                        Ice
                    </div>

                </div>
            </div>

            <div class="card">
                <div class="card-inner">

                    <div class="power lightning">
                        <img src="carta oscuridad.png" alt="">
                    </div>

                    <div class="back lightning-back">
                        Lightning
                    </div>

                </div>
            </div>

            <div class="card">
                <div class="card-inner">

                    <div class="power nature">
                        <img src="carta bosque.png">
                    </div>

                    <div class="back nature-back">
                        nature
                    </div>

                </div>
            </div>

            <div class="card">
                <div class="card-inner">

                    <div class="power dark">
                        <img src="carta oscuridad oscuridad.png">
                    </div>

                    <div class="back dark-back">
                        dark
                    </div>

                </div>
            </div>

            <div class="card">
                <div class="card-inner">

                    <div class="power light">
                        <img src="carta luz.png">
                    </div>

                    <div class="back light-back">
                        Light
                    </div>

                </div>
            </div>
        </section>


    </main>




</body>
</html>
